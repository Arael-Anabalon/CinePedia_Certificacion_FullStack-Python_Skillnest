{% extends 'base.html' %}
{% block content %}
<!-- Contenedor general -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-sm">
                <h2 class="mb-4">Inicio de Sesión</h2>
                <!-- Mensaje de error Flash -->
                {% with messages = get_flashed_messages(category_filter=["login"]) %}
                {% if messages %}
                <div class="alert alert-danger p-2 small">
                    {% for message in messages %}
                    <p class="mb-0">{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}
                <!-- Formulario de Inicio de sesión -->
                <form action="/procesar_inicio_sesion" method="POST">
                    <!-- Campo de correo electrónico -->
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <!-- Campo de contraseña -->
                    <div class="mb-4">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contrasena" name="contrasena" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Iniciar Sesión</button>
                    </div>
                </form>
                <div class="text-center mt-3 border-top pt-2">
                    <p class="small text-muted mb-0">¿No tienes cuenta? <a href="/registrarse"
                            class="text-decoration-none">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
