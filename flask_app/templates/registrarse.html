{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-sm">
                <h2 class="mb-4">Registro</h2>
                <!-- Mensajes de error Flash -->
                {% with messages = get_flashed_messages(category_filter=["registro"]) %}
                {% if messages %}
                <div class="alert alert-danger p-2 small">
                    {% for message in messages %}
                    <p class="mb-0">{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}
                <!-- Formulario de registro -->
                <form action="/procesar_registro" method="POST">
                    <div class="mb-3">
                        <!-- Campo de nombre -->
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre"
                            value="{{ session['reg_nombre'] if 'reg_nombre' in session else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <!-- Campo de apellido -->
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido" name="apellido"
                            value="{{ session['reg_apellido'] if 'reg_apellido' in session else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <!-- Campo de correo electrónico -->
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email"
                            value="{{ session['reg_email'] if 'reg_email' in session else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <!-- Campo de contraseña -->
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contrasena" name="contrasena" required>
                    </div>
                    <div class="mb-4">
                        <!-- Campo de confirmación de contraseña -->
                        <label for="confirmar_contrasena" class="form-label">Conf. Contraseña</label>
                        <input type="password" class="form-control" id="confirmar_contrasena"
                            name="confirmar_contrasena" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Registrar</button>
                    </div>
                </form>
                <div class="text-center mt-3 border-top pt-2">
                    <p class="small text-muted mb-0">
                        ¿Ya tienes cuenta? <a href="/" class="text-decoration-none">Inicia sesión aquí</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
