{% extends 'base.html' %}
{% block content %}
<!-- Contenedor general -->
<div class="container mt-4">
    <div class="card">
        <!-- Tabla de películas -->
        <table class="table table-striped table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th class="p-3">Película</th>
                    <th class="p-3">Director</th>
                    <th class="p-3">Fecha de Estreno</th>
                    <th class="p-3 text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Por cada película en peliculas, se generará... -->
                {% for peli in peliculas %}
                <tr>
                    <!-- Título -->
                    <td class="p-3 fw-bold">{{ peli.titulo }}</td>
                    <!-- Director -->
                    <td class="p-3">{{ peli.director }}</td>
                    <!-- Fecha de estreno -->
                    <td class="p-3 text-muted">{{ peli.fecha_estreno }}</td>
                    <!-- Acciones -->
                    <td class="p-3 text-end">
                        <a href="/cine/{{ peli.id_pelicula }}" class="btn btn-sm btn-light border me-1">Ver</a>
                        {% if peli.publicador_id == session['usuario_id'] %}
                        <a href="/cine/editar/{{ peli.id_pelicula }}"
                            class="btn btn-sm btn-light border text-primary me-1">Editar</a>
                        <a href="/cine/borrar/{{ peli.id_pelicula }}"
                            class="btn btn-sm btn-light border text-danger">Borrar</a>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
